stages:
  - test
  - build

include:
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/cloistr-rules.yml'
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/go-test.yml'
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/kaniko-build.yml'

.go-cache: &go-cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .go/pkg/mod/
    policy: pull-push



build:relay:
  extends: .kaniko-build
  stage: build

build:admin:
  extends: .kaniko-build
  stage: build
  variables:
    KANIKO_DOCKERFILE_SUBPATH: "/Dockerfile.admin"
    KANIKO_IMAGE: "$CI_REGISTRY_IMAGE/admin"

test:unit:
  extends: [.go-test, .cloistr-rules]
  variables:
    GO_TEST_PACKAGES: "./internal/..."

lint:
  extends: [.go-lint, .cloistr-rules]
