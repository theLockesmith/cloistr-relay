stages:
  - test
  - build

include:
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/cloistr-rules.yml'
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/go-test.yml'
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/kaniko-build.yml'

.go-cache: &go-cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .go/pkg/mod/
    policy: pull-push



build:relay:
  extends: .kaniko-build
  stage: build
  variables:
    KANIKO_EXTRA_FLAGS: "--build-arg VERSION=${CI_COMMIT_SHORT_SHA}"

build:admin:
  extends: .kaniko-build
  stage: build
  variables:
    KANIKO_DOCKERFILE_SUBPATH: "/Dockerfile.admin"
    KANIKO_IMAGE: "$CI_REGISTRY_IMAGE/admin"

test:unit:
  extends: [.go-test, .cloistr-rules]
  services:
    - name: postgres:15-alpine
      alias: postgres
      variables:
        POSTGRES_DB: nostr_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
  variables:
    GO_TEST_PACKAGES: "./internal/..."
    TEST_DATABASE_URL: "postgres://postgres:postgres@postgres:5432/nostr_test?sslmode=disable"

lint:
  extends: [.go-lint, .cloistr-rules]
